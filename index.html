<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GLSL Studio</title>
<style>
    :root { color-scheme: dark; }
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e2e;
    }
    #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
    }
    /* Recibe teclado, texto (IME) y portapapeles. Invisible. */
    #ime {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        margin: 0;
        opacity: 0;
        resize: none;
        overflow: hidden;
        font-size: 16px; /* evita el zoom automático de iOS al enfocar */
        caret-color: transparent;
        color: transparent;
        background: transparent;
    }
    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        color: #cdd6f4;
        font: 16px/1.4 system-ui, sans-serif;
        text-align: center;
        background: #1e1e2e;
    }
    #loading::after {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid #585b70;
        border-top-color: #cdd6f4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    #loading.error::after { display: none; }
    #loading.error { color: #f38ba8; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="GLSL Studio"></textarea>
<div id="loading">GLSL Studio</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
